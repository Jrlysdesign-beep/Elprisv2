<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Elpris"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>Elpris V5</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:900px;margin:auto;padding:18px}header{display:flex;justify-content:space-between}.t{font-size:32px;font-weight:900}.muted{opacity:.65}.hero,.card{background:#1e293b;border-radius:22px;padding:20px;margin-top:14px}.hero{text-align:center;padding:28px}.green{background:#15803d}.yellow{background:#ca8a04}.red{background:#b91c1c}.price{font-size:64px;font-weight:900}.advice{font-size:23px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.label{opacity:.65}.val{font-size:20px;font-weight:800;margin-top:7px}.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.h{padding:10px 4px;border-radius:14px;text-align:center;font-weight:800}.err{background:#7f1d1d;padding:12px;border-radius:12px;margin-top:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.hours{grid-template-columns:repeat(4,1fr)}.price{font-size:52px}}</style></head>
<body><div class="w"><header><div><div class="t">⚡ Elpris</div><div class="muted">DK2 · Sjælland</div></div><b id="clock"></b></header><div id="hero" class="hero"><b id="status">HENTER PRISDATA</b><div id="price" class="price">–</div><div>kr./kWh · spotpris</div><div id="advice" class="advice">Et øjeblik…</div></div><div id="err"></div>
<div class="grid"><div class="card"><div class="label">Billigste time</div><div id="cheap" class="val">–</div></div><div class="card"><div class="label">Vask / opvask</div><div id="wash" class="val">–</div></div><div class="card"><div class="label">Elbil · billigste 4 timer</div><div id="car" class="val">–</div></div></div>
<div class="card"><div class="label">Næste timer</div><div id="hours" class="hours"></div></div><p class="muted" style="text-align:center">🟢 under 1,00 kr. · 🟡 1,00–1,99 kr. · 🔴 2,00 kr. eller mere</p></div>
<script>
const $=x=>document.getElementById(x),fmt=x=>Number(x).toLocaleString("da-DK",{minimumFractionDigits:2,maximumFractionDigits:2}),hh=x=>new Date(x).toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"}),col=x=>x<1?"green":x<2?"yellow":"red";
function tick(){$("clock").textContent=new Date().toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"})}tick();setInterval(tick,10000);
async function load(){try{let r=await fetch("./prices.json?"+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("prices.json mangler");let d=await r.json(),a=(d.hours||[]).map(x=>({t:new Date(x.time),p:+x.price})).sort((a,b)=>a.t-b.t);if(!a.length)throw Error("ingen priser");let n=new Date(),c=a.find(x=>n>=x.t&&n<new Date(x.t.getTime()+3600000))||a.find(x=>x.t>=n)||a[0],f=a.filter(x=>x.t>=new Date(n-3600000));$("hero").className="hero "+col(c.p);$("status").textContent="PRISDATA ONLINE";$("price").textContent=fmt(c.p);$("advice").textContent=c.p<1?"GRØN – godt tidspunkt at bruge strøm":c.p<2?"GUL – okay, men der findes billigere timer":"RØD – vent hvis du kan";let q=[...f].sort((a,b)=>a.p-b.p)[0];$("cheap").textContent=q?hh(q.t)+" · "+fmt(q.p)+" kr.":"–";let g=f.find(x=>x.p<1);$("wash").textContent=c.p<1?"Kør nu":g?"Vent til "+hh(g.t):"Ingen grøn time fundet";let best;for(let i=0;i<=f.length-4;i++){let b=f.slice(i,i+4);if(b.every((x,j)=>!j||x.t-b[j-1].t===3600000)){let av=b.reduce((s,x)=>s+x.p,0)/4;if(!best||av<best.av)best={b,av}}}$("car").textContent=best?hh(best.b[0].t)+"–"+hh(new Date(best.b[3].t.getTime()+3600000))+" · "+fmt(best.av)+" kr.":"–";$("hours").innerHTML=f.slice(0,24).map(x=>`<div class="h ${col(x.p)}"><div>${hh(x.t)}</div><div>${fmt(x.p)}</div></div>`).join("");$("err").innerHTML=""}catch(e){$("status").textContent="PRISDATA OFFLINE";$("advice").textContent="Kør GitHub Action én gang";$("err").innerHTML='<div class="err">'+e.message+'</div>'}}load();setInterval(load,300000);if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
