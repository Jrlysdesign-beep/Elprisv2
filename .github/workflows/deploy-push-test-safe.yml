name: Deploy isolated push test (manual only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-PUSH-TEST to deploy isolated Worker (existing VAPID keys are preserved)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-test:
    if: github.event.inputs.confirmation == 'DEPLOY-PUSH-TEST'
    runs-on: ubuntu-latest
    environment: push-test
    defaults:
      run:
        working-directory: push-test
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4
        with:
          ref: feature/webpush-isolated-2026-10-27
      - name: Validate isolated configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/webpush-isolated-2026-10-27"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node -e 'const c=JSON.parse(require("node:fs").readFileSync("wrangler.jsonc","utf8"));if(c.name!=="elpris-push-isolated-test"||c.d1_databases?.length!==1||c.d1_databases[0].database_name!=="elpris-push-isolated-test-db"||c.triggers?.crons?.length)process.exit(1)'
      - name: Install dependencies
        run: npm install
      - name: Deploy isolated Worker without replacing existing VAPID secrets
        run: npx wrangler deploy --config wrangler.jsonc
