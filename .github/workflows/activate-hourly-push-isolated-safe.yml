name: Activate hourly push on isolated test Worker (manual only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ACTIVATE-HOURLY-PUSH-ISOLATED to enable real hourly push notifications on the isolated test Worker'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: elpris-isolated-hourly-push-activation
  cancel-in-progress: false

jobs:
  activate-isolated-hourly-push:
    if: github.event.inputs.confirmation == 'ACTIVATE-HOURLY-PUSH-ISOLATED'
    runs-on: ubuntu-latest
    environment: push-test
    defaults:
      run:
        working-directory: push-test
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out isolated test branch only
        uses: actions/checkout@v4
        with:
          ref: feature/webpush-isolated-2026-10-27
          persist-credentials: false
      - name: Fail closed unless exact isolated target and hourly activation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/webpush-isolated-2026-10-27"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node <<'NODE'
          const fs=require("node:fs");
          const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const d=c.d1_databases;
          if(c.name!=="elpris-push-isolated-test" ||
             c.main!=="src/worker.js" ||
             !Array.isArray(d) || d.length!==1 ||
             d[0].binding!=="DB" ||
             d[0].database_name!=="elpris-push-isolated-test-db" ||
             d[0].database_id!=="2811e53d-ee9d-45d2-94dc-d8ffed33d447" ||
             c.triggers?.crons?.length!==1 ||
             c.triggers.crons[0]!=="0 * * * *" ||
             c.vars?.ENABLE_AUTOMATIC_PRICE_PUSH!=="true") {
             throw Error("Refusing activation: isolated target, database, cron, or enable flag mismatch");
          }
          console.log("Validated isolated Worker, D1 and hourly cron");
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Run isolated unit tests
        run: npm test
      - name: Build without deployment
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Deploy only isolated Worker and enable hourly cron
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Explain next verification
        run: |
          echo "Isolated Worker deployment completed. Check the Worker trigger and delivery records in Cloudflare; a successful deploy alone does not prove notification delivery."
