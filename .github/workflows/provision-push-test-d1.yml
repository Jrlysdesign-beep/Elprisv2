name: Provision isolated push D1 test database (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provision-push-test-d1
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: push-test
    defaults:
      run:
        working-directory: push-test
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out isolated test branch only
        uses: actions/checkout@v4
        with:
          ref: feature/webpush-isolated-2026-10-27
          persist-credentials: true
      - name: Verify isolated branch and test configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/webpush-isolated-2026-10-27"
          grep -q '"name": "elpris-push-isolated-test"' wrangler.jsonc
          grep -q '"database_name": "elpris-push-isolated-test-db"' wrangler.jsonc
          test -f scripts/provision-test-db.mjs
          test -f schema.sql
      - name: Install dependencies
        run: npm install
      - name: Create or locate isolated D1 database
        run: node scripts/provision-test-db.mjs
      - name: Apply schema to isolated D1 only
        run: npx wrangler d1 execute elpris-push-isolated-test-db --remote --file=./schema.sql --config wrangler.jsonc
      - name: Commit D1 binding to isolated test branch only
        shell: bash
        run: |
          set -euo pipefail
          git add push-test/wrangler.jsonc
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Configure isolated push test D1 binding'
          git push origin HEAD:feature/webpush-isolated-2026-10-27
