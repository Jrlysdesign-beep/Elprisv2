name: Deploy isolated push test (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    environment: push-test
    defaults:
      run:
        working-directory: push-test
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated Worker configuration
        shell: bash
        run: |
          test -f wrangler.jsonc
          grep -q '"name": "elpris-push-isolated-test"' wrangler.jsonc
          if grep -q REPLACE_WITH_NEW_TEST_D1_ID wrangler.jsonc; then
            echo "A separate D1 test database must be configured before deployment"
            exit 1
          fi
      - name: Install dependencies
        run: npm install
      - name: Deploy isolated Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: push-test
          command: deploy --config wrangler.jsonc
