name: Audit isolated push price engine (dry run only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: push-test
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4
        with:
          ref: feature/webpush-isolated-2026-10-27
      - name: Verify isolated branch and no scheduled triggers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/webpush-isolated-2026-10-27"
          node -e 'const c=JSON.parse(require("node:fs").readFileSync("wrangler.jsonc","utf8"));if(c.name!=="elpris-push-isolated-test"||c.triggers?.crons?.length)process.exit(1)'
      - name: Check Worker and module syntax without executing push
        run: |
          node --check src/worker.js
          node --check src/price-engine.js
          node --check src/test-price-feed.js
          node --check src/delivery-status.js
      - name: Build isolated Worker locally without deploying
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/elpris-isolated-worker-build --config wrangler.jsonc
      - name: Run timezone and duplicate unit tests
        run: npm test
      - name: Real SQLite concurrent reservation test (temporary database only)
        run: python3 scripts/test-sqlite-reservations.py
      - name: Test overlapping delivery reservations in temporary SQLite
        run: python3 scripts/test-overlap-reservations.py
      - name: Verify actual Worker SQL against isolated migrations offline
        run: python3 scripts/test-worker-sql-contract.py
      - name: Read-only price feed dry run
        run: npm run dry-run
