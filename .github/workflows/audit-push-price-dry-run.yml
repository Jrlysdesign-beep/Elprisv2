name: Audit isolated push price engine (dry run only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: push-test
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4
        with:
          ref: feature/webpush-isolated-2026-10-27
      - name: Verify isolated branch and no scheduled triggers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/webpush-isolated-2026-10-27"
          node -e 'const c=JSON.parse(require("node:fs").readFileSync("wrangler.jsonc","utf8"));if(c.name!=="elpris-push-isolated-test"||c.triggers?.crons?.length)process.exit(1)'
      - name: Run timezone and duplicate unit tests
        run: npm test
      - name: Read-only price feed dry run
        run: npm run dry-run
